services:
  db:
    image: postgres:15
    container_name: scan_cv_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [app-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: scan_cv_pgadmin
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "8080:80"
    networks: [app-network]

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: scan_cv_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__SERVICE__ENABLE_HTTP2: "true"
      QDRANT__LOG_LEVEL: INFO
      QDRANT__STORAGE__PERIODIC_SNAPSHOT: "true"
      QDRANT__STORAGE__SNAPSHOT_PERIOD_SEC: 3600
    volumes:
      - qdrant_storage:/qdrant/storage
    networks: [app-network]
    # healthcheck:
    #   test: ["CMD", "curl", "-fsS", "http://localhost:6333/readyz"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 20

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: scan_cv_backend
    restart: unless-stopped
    env_file: .env
    environment:
      # GOOGLE_APPLICATION_CREDENTIALS: /var/secrets/gcp/sa-key.json
      # GCP_PROJECT: ${GCP_PROJECT}
      # GCS_BUCKET: ${GCS_BUCKET}
      DATABASE_URL: ${DATABASE_URL}
      ENVIRONMENT: ${ENVIRONMENT}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started    # service_healthy
    networks: [app-network]
    # volumes:
    #   - ./secrets/sa-key.json:/var/secrets/gcp/sa-key.json:ro
    command: >
      bash -lc "uvicorn app.api.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: scan_cv_frontend
    restart: unless-stopped
    env_file: .env
    environment:
      API_BASE_URL: ${API_BASE_URL}
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_started
    networks: [app-network]
    command: >
      bash -lc "streamlit run admin/main.py --server.port 8501 --server.address 0.0.0.0"

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  qdrant_storage:
