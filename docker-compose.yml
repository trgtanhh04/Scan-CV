version: '3.8'

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: scan_cv_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:yourpassword@db:5432/scan_cv
      - ENVIRONMENT=development
    ports:
      - "8000:8000"
    volumes:
      - ./Backend:/app
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - app-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: scan_cv_frontend
    restart: unless-stopped
    environment:
      - API_URL=http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend
    volumes:
      - ./Frontend:/app
    networks:
      - app-network

  db:
    image: postgres:15
    container_name: scan_cv_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yourpassword
      POSTGRES_DB: scan_cv
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: