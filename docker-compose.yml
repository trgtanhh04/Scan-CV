  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - ./Backend:/app
  #     - ./media:/app/media
  #   depends_on:
  #     - db
  #     - qdrant
  #   networks:
  #     - app-network
  #   command: >
  #     bash -lc "uvicorn app.api.main:app --host 0.0.0.0 --port 8000"

  # frontend:
  #   build:
  #     context: ./Frontend
  #     dockerfile: Dockerfile
  #   container_name: scan_cv_frontend
  #   restart: unless-stopped
  #   environment:
  #     - API_BASE_URL=http://backend:8000
  #   ports:
  #     - "8501:8501"
  #   depends_on:
  #     - backend
  #   volumes:
  #     - ./Frontend:/app
  #   networks:
  #     - app-network
  #   command: >
  #     bash -lc "streamlit run admin/main.py --server.port 8501 --server.address 0.0.0.0"

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  # === thêm volume cho Qdrant ===
  qdrant_storage:
